<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>VANE 體驗會 - 掃碼核銷</title>
<style>
:root { --teal:#3fd0bb; --bg:#050808; --ok:#1f8f5a; --warn:#b8860b; --err:#b3392f; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; height:100%; background:var(--bg); color:#fff; font-family:-apple-system,'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif; }
body { display:flex; flex-direction:column; min-height:100dvh; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
header { padding:14px 16px 6px; text-align:center; }
header h1 { margin:0; font-size:17px; letter-spacing:.18em; color:var(--teal); }
header p { margin:4px 0 0; font-size:12px; color:rgba(255,255,255,.5); letter-spacing:.08em; }
main { flex:1; display:flex; flex-direction:column; align-items:center; padding:8px 16px 16px; gap:12px; }
.screen { width:100%; max-width:480px; display:none; flex-direction:column; align-items:center; gap:12px; }
.screen.on { display:flex; }

#pinScreen { margin-top:12vh; }
#pinScreen label { font-size:15px; color:rgba(255,255,255,.8); }
input.txt { width:100%; font:inherit; font-size:20px; text-align:center; padding:14px; border-radius:12px; border:1px solid rgba(63,208,187,.35); background:#0b1412; color:#fff; letter-spacing:.3em; }
input.txt.plain { letter-spacing:.05em; font-size:17px; text-align:left; }
input.txt:focus { outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(63,208,187,.2); }
.btn { font:inherit; font-weight:700; font-size:17px; letter-spacing:.2em; padding:13px 30px; border:0; border-radius:99px; color:#04201b; background:linear-gradient(180deg,#5fe5d0,#2fb8a3); box-shadow:0 0 18px rgba(63,208,187,.35); cursor:pointer; }
.btn:disabled { filter:grayscale(.8) brightness(.6); box-shadow:none; }
.btn.ghost { background:transparent; color:#fff; border:1px solid rgba(255,255,255,.28); box-shadow:none; font-size:14px; padding:10px 18px; letter-spacing:.1em; }
.msg { min-height:20px; font-size:14px; color:#ff8f86; text-align:center; }

#viewport { position:relative; width:100%; aspect-ratio:1/1; max-height:62vh; border-radius:18px; overflow:hidden; background:#000; border:1px solid rgba(63,208,187,.35); }
#reader { width:100%; height:100%; }
#reader video { object-fit:cover; }
#viewport .frame { position:absolute; inset:14%; border:2px solid rgba(63,208,187,.85); border-radius:16px; pointer-events:none; box-shadow:0 0 0 999px rgba(0,0,0,.35); }
#camMsg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; font-size:15px; line-height:1.7; color:rgba(255,255,255,.75); background:#050808; }

#result { width:100%; border-radius:14px; padding:16px; text-align:center; font-size:20px; font-weight:700; line-height:1.5; background:#0b1412; border:1px solid rgba(255,255,255,.12); color:rgba(255,255,255,.6); transition:background .2s; }
#result small { display:block; font-size:13px; font-weight:400; opacity:.85; }
#result.ok { background:var(--ok); border-color:transparent; color:#fff; }
#result.warn { background:var(--warn); border-color:transparent; color:#fff; }
#result.err { background:var(--err); border-color:transparent; color:#fff; }
#result.busy { color:var(--teal); }
#log { width:100%; display:flex; flex-direction:column; gap:6px; }
.entry { display:flex; justify-content:space-between; gap:10px; align-items:center; padding:9px 12px; border-radius:10px; font-size:14px; background:#0b1412; border:1px solid rgba(255,255,255,.1); }
.entry b { font-weight:700; }
.entry span.code { opacity:.55; font-size:12px; margin-left:6px; }
.entry.ok { border-color:var(--ok); } .entry.warn { border-color:var(--warn); } .entry.err { border-color:var(--err); cursor:pointer; } .entry.pend { color:var(--teal); }
.row { display:flex; gap:10px; align-items:center; justify-content:space-between; width:100%; font-size:13px; color:rgba(255,255,255,.55); }

#manual { position:fixed; inset:0; background:rgba(0,0,0,.78); display:none; align-items:flex-end; justify-content:center; z-index:20; }
#manual.on { display:flex; }
#manual .sheet { width:100%; max-width:480px; background:#0b1412; border-radius:20px 20px 0 0; padding:20px 16px calc(20px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:12px; border:1px solid rgba(63,208,187,.3); }
#manual h2 { margin:0; font-size:16px; letter-spacing:.12em; text-align:center; color:var(--teal); }
</style>
</head>
<body>
<header>
  <h1>VANE 體驗會・核銷</h1>
  <p>工作人員專用</p>
</header>
<main>
  <section class="screen on" id="pinScreen">
    <label for="pin">請輸入工作人員 PIN 碼</label>
    <input class="txt" id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="••••">
    <button class="btn" id="pinBtn" type="button">開始掃碼</button>
    <div class="msg" id="pinMsg"></div>
  </section>

  <section class="screen" id="scanScreen">
    <div id="viewport">
      <div id="reader"></div>
      <div class="frame"></div>
      <div id="camMsg">正在開啟相機⋯<br>請在跳出的視窗按「允許」</div>
    </div>
    <div id="result">請把參加者的 QR 對準框內</div>
    <div id="log"></div>
    <div class="row">
      <span id="counter">本機已核銷 0 位</span>
      <span>
        <button class="btn ghost" id="manualBtn" type="button">現場手動登記</button>
        <button class="btn ghost" id="logoutBtn" type="button">登出</button>
      </span>
    </div>
  </section>
</main>

<div id="manual">
  <div class="sheet">
    <h2>現場手動登記</h2>
    <input class="txt plain" id="mName" type="text" placeholder="姓名" autocomplete="off">
    <input class="txt plain" id="mContact" type="text" placeholder="聯絡方式（手機或信箱，可留空）" autocomplete="off">
    <div class="msg" id="mMsg"></div>
    <button class="btn" id="mSubmit" type="button">登記並核銷</button>
    <button class="btn ghost" id="mCancel" type="button">取消</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
var API = 'https://script.google.com/macros/s/AKfycbzkWwVF-LSRqI5HwE6Vm4C41u1D0icm0cFbtlg9CXpfr2FdHDZiwkI5CNkIY7eCEtFw/exec';
var PIN_KEY = 'vane_staff_pin', PIN_TTL_MS = 12 * 3600 * 1000;
var $ = function (id) { return document.getElementById(id); };
var scanner = null, scanning = false, lastAt = 0, okCount = 0, cbSeq = 0;

function savePin(p) { try { localStorage.setItem(PIN_KEY, JSON.stringify({ p: p, t: Date.now() })); } catch (e) {} }
function loadPin() {
  try { var o = JSON.parse(localStorage.getItem(PIN_KEY) || 'null'); if (o && Date.now() - o.t < PIN_TTL_MS) return o.p; } catch (e) {}
  return '';
}
function clearPin() { try { localStorage.removeItem(PIN_KEY); } catch (e) {} }
var PIN = '';

function api(params, cb) {
  var name = '__vane_cb' + (++cbSeq), done = false, s = document.createElement('script');
  function finish(res) { if (done) return; done = true; clearTimeout(timer); try { delete window[name]; } catch (e) { window[name] = undefined; } if (s.parentNode) s.parentNode.removeChild(s); cb(res); }
  var timer = setTimeout(function () { finish({ success: false, message: '連線逾時，請重試', net: true }); }, 60000);
  window[name] = function (res) { finish(res); };
  s.onerror = function () { finish({ success: false, message: '連線失敗，請檢查網路', net: true }); };
  var q = []; params.pin = PIN; params.callback = name;
  for (var k in params) q.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
  s.src = API + '?page=api&' + q.join('&');
  document.head.appendChild(s);
}

function show(id) { ['pinScreen', 'scanScreen'].forEach(function (x) { $(x).classList.toggle('on', x === id); }); }
function setResult(cls, html) { var r = $('result'); r.className = cls || ''; r.innerHTML = html; }
function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function beep(f, d) {
  try { var A = window.AudioContext || window.webkitAudioContext; if (!window.__a) window.__a = new A(); var a = window.__a, o = a.createOscillator(), g = a.createGain();
    o.frequency.value = f; o.type = 'sine'; g.gain.value = 0.08; o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + d); } catch (e) {}
}
function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

function tryPin(p, auto) {
  if (!p) return;
  $('pinBtn').disabled = true; $('pinMsg').textContent = '驗證中⋯';
  PIN = p;
  api({ action: 'ping' }, function (res) {
    $('pinBtn').disabled = false;
    if (res && res.success) { savePin(p); $('pinMsg').textContent = ''; $('pin').value = ''; show('scanScreen'); startScan(); }
    else { PIN = ''; clearPin(); $('pinMsg').textContent = (res && res.message) || '驗證失敗'; if (auto) show('pinScreen'); }
  });
}

function parseCode(text) {
  text = String(text || '').trim();
  var m = text.match(/[?&]code=([^&#\s]+)/i);
  if (m) { try { return decodeURIComponent(m[1]).toUpperCase(); } catch (e) { return m[1].toUpperCase(); } }
  if (/^[A-Za-z]+-\d+$/.test(text)) return text.toUpperCase();
  return '';
}

var entries = {}, order = [];
function renderLog() {
  var h = '';
  order.slice(-6).reverse().forEach(function (c) {
    var e = entries[c], icon = e.st === 'ok' ? '✓' : e.st === 'warn' ? '!' : e.st === 'err' ? '✕' : '…';
    h += '<div class="entry ' + (e.st === 'pend' ? 'pend' : e.st) + '" data-code="' + esc(c) + '"><span><b>' + icon + ' ' + esc(e.label) + '</b>' + (e.label !== c ? '<span class="code">' + esc(c) + '</span>' : '') + '</span><span>' + esc(e.note) + '</span></div>';
  });
  $('log').innerHTML = h;
}
$('log').addEventListener('click', function (ev) {
  var n = ev.target.closest ? ev.target.closest('.entry') : null;
  if (n && n.className.indexOf('err') > -1) { var c = n.getAttribute('data-code'); if (entries[c]) { entries[c].st = 'pend'; entries[c].note = '重試中⋯'; renderLog(); sendCheckin(c); } }
});

function onScan(text) {
  var code = parseCode(text), now = Date.now();
  if (!code) { if (now - lastAt > 2500) { lastAt = now; setResult('err', '這不是參加者的 QR<small>' + esc(String(text).slice(0, 60)) + '</small>'); buzz(200); } return; }
  var e = entries[code];
  if (e && (e.st === 'pend' || (e.st !== 'err' && now - e.at < 60000))) { return; }
  entries[code] = { st: 'pend', label: code, note: '核銷中⋯', at: now };
  order = order.filter(function (c) { return c !== code; }); order.push(code);
  setResult('busy', '已掃到 ' + esc(code) + '<small>核銷中⋯可以繼續掃下一位</small>'); beep(660, 0.06); buzz(30);
  renderLog(); sendCheckin(code);
}

function sendCheckin(code) {
  api({ action: 'checkin', code: code }, function (res) {
    var e = entries[code]; e.at = Date.now();
    if (res && res.success && !res.alreadyChecked) {
      okCount++; $('counter').textContent = '本機已核銷 ' + okCount + ' 位';
      e.st = 'ok'; e.label = res.name; e.note = '核銷成功';
      setResult('ok', '核銷成功<small>' + esc(res.name) + '（' + esc(code) + '）</small>'); beep(880, 0.15); buzz(60);
    } else if (res && res.alreadyChecked) {
      e.st = 'warn'; e.label = res.name; e.note = '已登記過';
      setResult('warn', '已登記過<small>' + esc(res.name) + '（' + esc(code) + '）</small>'); beep(440, 0.25); buzz([80, 60, 80]);
    } else if (res && res.message === 'PIN 錯誤') {
      clearPin(); PIN = ''; stopScan(); show('pinScreen'); $('pinMsg').textContent = 'PIN 已失效，請重新輸入';
    } else {
      e.st = 'err'; e.note = res && res.net ? '連線失敗，點此重試' : esc((res && res.message) || '核銷失敗');
      setResult('err', esc((res && res.message) || '核銷失敗') + '<small>' + esc(code) + (res && res.net ? '（點下方紅色項目重試）' : '') + '</small>'); beep(220, 0.35); buzz(250);
    }
    renderLog();
  });
}

function startScan() {
  if (scanning) return;
  if (typeof Html5Qrcode === 'undefined') { $('camMsg').textContent = '掃碼元件載入失敗，請檢查網路後重新整理頁面'; return; }
  $('camMsg').style.display = 'flex';
  scanner = scanner || new Html5Qrcode('reader', { verbose: false });
  scanner.start({ facingMode: 'environment' }, { fps: 10, aspectRatio: 1 }, onScan, function () {})
    .then(function () { scanning = true; $('camMsg').style.display = 'none'; })
    .catch(function (err) {
      $('camMsg').innerHTML = '無法開啟相機<br><small>請確認瀏覽器已允許使用相機（網址列的設定→相機→允許），然後重新整理頁面。<br>也可以改用「現場手動登記」。</small>';
    });
}
function stopScan() { if (scanner && scanning) { scanner.stop().catch(function () {}); } scanning = false; }

$('pinBtn').addEventListener('click', function () { tryPin($('pin').value.trim()); });
$('pin').addEventListener('keydown', function (e) { if (e.key === 'Enter') tryPin($('pin').value.trim()); });
$('logoutBtn').addEventListener('click', function () { clearPin(); PIN = ''; stopScan(); show('pinScreen'); setResult('', '請把參加者的 QR 對準框內'); });

$('manualBtn').addEventListener('click', function () { $('manual').classList.add('on'); $('mMsg').textContent = ''; $('mName').focus(); });
$('mCancel').addEventListener('click', function () { $('manual').classList.remove('on'); });
$('mSubmit').addEventListener('click', function () {
  var n = $('mName').value.trim(); if (!n) { $('mMsg').textContent = '請輸入姓名'; return; }
  $('mSubmit').disabled = true; $('mMsg').textContent = '登記中⋯';
  api({ action: 'register', name: n, contact: $('mContact').value.trim() }, function (res) {
    $('mSubmit').disabled = false;
    if (res && res.success) {
      okCount++; $('counter').textContent = '本機已核銷 ' + okCount + ' 位';
      $('manual').classList.remove('on'); $('mName').value = ''; $('mContact').value = '';
      setResult('ok', '登記並核銷成功<small>' + esc(res.name) + '（' + esc(res.code) + '）</small>'); beep(880, 0.15); buzz(60);
    } else { $('mMsg').textContent = (res && res.message) || '登記失敗'; }
  });
});

var saved = loadPin();
if (saved) tryPin(saved, true);
</script>
</body>
</html>
